services:
  tiktok-to-telegram:
    build: .
    restart: unless-stopped
    depends_on:
      bgutil-provider:
        condition: service_started
    ports:
      - "127.0.0.1:6767:8080"
    volumes:
      - ./data:/config/data
      - ./config.yaml:/config/config.yaml:ro
      - ./tiktok-cookies.txt:/config/tiktok-cookies.txt:ro
      - ./instagram-cookies.txt:/config/instagram-cookies.txt:ro
      - ./youtube-cookies.txt:/config/youtube-cookies.txt:ro
      # Нужен только при spotify.cookies_file: spotify-cookies.txt.
      # Проще загрузить этот файл через настройки веб-интерфейса.
      # - ./spotify-cookies.txt:/config/spotify-cookies.txt:ro
      # Необязательные cookies для ограниченных публикаций X / Twitter и Reddit.
      # Их также можно загрузить через настройки веб-интерфейса.
      # - ./twitter-cookies.txt:/config/twitter-cookies.txt:ro
      # - ./reddit-cookies.txt:/config/reddit-cookies.txt:ro

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
