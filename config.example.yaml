telegram:
  bot_token: "123456789:replace_me"
  chat_id: "@my_channel"
  channels:
    - name: "Основной канал"
      chat_id: "@my_channel"
    - name: "Тестовый канал"
      chat_id: "@my_test_channel"

tiktok:
  # Оставьте список пустым, если нужен только ручной веб-интерфейс.
  channels:
    - "@first_author"
    - "https://www.tiktok.com/@second_author"
  poll_interval_seconds: 300
  scan_limit: 15
  post_existing: false
  # Экспортированный cookies.txt в Netscape-формате, если TikTok требует авторизацию.
  # cookies_file: tiktok-cookies.txt

instagram:
  # Экспортированный cookies.txt в Netscape-формате, если Instagram требует вход.
  # cookies_file: instagram-cookies.txt

youtube:
  # Экспортированный cookies.txt для YouTube, если сервис требует подтверждение входа.
  # cookies_file: youtube-cookies.txt
  po_token_provider_url: http://bgutil-provider:4416

spotify:
  # Cookies open.spotify.com в Netscape-формате. Для 320 кбит/с нужен Premium
  # и cookie sp_dc. Файл также можно загрузить через настройки приложения.
  # cookies_file: spotify-cookies.txt

twitter:
  # Необязательно для публичных постов. Cookies нужны для закрытых,
  # возрастных или ограниченных публикаций X / Twitter.
  # cookies_file: twitter-cookies.txt

reddit:
  # Необязательно для большинства публичных постов. Можно указать cookies
  # для контента, доступного только после входа.
  # cookies_file: reddit-cookies.txt

web:
  host: 0.0.0.0
  port: 8080
  # Одноразовые данные подтверждения первичной настройки администратора.
  # Это не логин после настройки. Обязательно замените оба значения,
  # особенно если порт приложения доступен не только с localhost.
  username: setup-admin
  password: replace_with_a_long_random_bootstrap_password

data_dir: data
